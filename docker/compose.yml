# FOQB on a self-hosted Supabase subset: Postgres, Auth (GoTrue) and the
# database API (PostgREST), behind one internal gateway. Only the app is
# published; the browser never talks to Supabase directly.
#
# Setup: docker/setup.sh writes .env next to this file. Then:
#   docker compose up -d
# Versions match the hosted Supabase project this repo runs against.

name: ${COMPOSE_PROJECT_NAME:-foqb}

services:
  db:
    image: supabase/postgres:17.6.1.166
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: /var/run/postgresql
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 20

  auth:
    image: supabase/gotrue:v2.197.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${SITE_URL}/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${SITE_URL}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"
      # No mail server: accounts work immediately and no email is ever sent
      # (so password-reset email doesn't work either). Set the GOTRUE_SMTP_*
      # variables and turn this off to require confirmation instead.
      GOTRUE_MAILER_AUTOCONFIRM: ${MAILER_AUTOCONFIRM:-true}
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    image: ${FOQB_MIGRATE_IMAGE:-foqb-migrate:latest}
    pull_policy: missing
    build:
      context: ..
      target: migrate
    depends_on:
      auth:
        condition: service_healthy
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

  rest:
    image: postgrest/postgrest:v14.5
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  # What the app calls its Supabase URL: /auth/v1 and /rest/v1 on one host,
  # the way hosted Supabase lays them out.
  supabase:
    image: caddy:2.10-alpine
    restart: unless-stopped
    depends_on: [auth, rest]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro

  app:
    image: ${FOQB_APP_IMAGE:-foqb-app:latest}
    pull_policy: missing
    build:
      context: ..
      target: app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-8090}:3000"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: http://supabase:8000
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      PLAID_CLIENT_ID: ${PLAID_CLIENT_ID:-}
      PLAID_SECRET: ${PLAID_SECRET:-}
      PLAID_ENV: ${PLAID_ENV:-sandbox}
      PLAID_WEBHOOK_URL: ${SITE_URL}/api/webhooks/plaid
      PLAID_REDIRECT_URI: ${SITE_URL}/settings/bank-return
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_JURISDICTION: ${LEGAL_JURISDICTION:-}
      SIGNUP_ALLOWLIST: ${SIGNUP_ALLOWLIST:-}
      DEMO_MODE: ${DEMO_MODE:-}
      SOURCE_CODE_URL: ${SOURCE_CODE_URL:-}

volumes:
  db-data:
