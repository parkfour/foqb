<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Slate to Navy -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <!-- Page / Ledger White Gradient -->
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>

    <!-- Quality Checkmark Green Gradient -->
    <linearGradient id="checkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Open / Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>

    <!-- Drop Shadow for Depth -->
    <filter id="glyphShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base App Icon Frame (Squircle) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Border Highlight -->
  <rect x="2" y="2" width="508" height="508" rx="110" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>

  <!-- Icon Glyph Group -->
  <g filter="url(#glyphShadow)">
    
    <!-- Left Page (Open Book / Ledger Base) -->
    <path d="M 112 340 
             C 112 340, 170 325, 236 345 
             V 195 
             C 170 175, 112 190, 112 190 
             Z" 
          fill="url(#pageGrad)"/>

    <!-- Left Page Accent Lines (Ledger Rows - scaled for visibility) -->
    <path d="M 142 230 C 172 222 206 228 216 232" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 142 265 C 172 257 206 263 216 267" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" fill="none"/>
    <path d="M 142 300 C 172 292 206 298 216 302" stroke="#94A3B8" stroke-width="10" stroke-linecap="round" fill="none"/>

    <!-- Right Page (Open Book Base Shape) -->
    <path d="M 400 340 
             C 400 340, 342 325, 276 345 
             V 195 
             C 342 175, 400 190, 400 190 
             Z" 
          fill="url(#pageGrad)"/>

    <!-- Center Book Spine/Fold Glow -->
    <path d="M 256 198 V 348" stroke="#0F172A" stroke-width="12" stroke-linecap="round"/>

    <!-- Quality Checkmark / Rising Growth (Sweeps from book center out top-right) -->
    <path d="M 210 260 
             L 260 310 
             L 385 150" 
          fill="none" 
          stroke="url(#checkGrad)" 
          stroke-width="36" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- "Open" Circle Badge (Top Left Corner Accent) -->
    <circle cx="132" cy="140" r="24" fill="url(#cyanGrad)"/>
    <path d="M 124 140 H 140 M 132 132 V 148" stroke="#FFFFFF" stroke-width="6" stroke-linecap="round"/>

  </g>
</svg>
